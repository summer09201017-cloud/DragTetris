<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon-192.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1020" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tetris" />
    <link rel="apple-touch-icon" href="/icons/icon-192.svg" />
    <title>俄羅斯方塊 Tetris</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  <script>
  // play-stats 三層匿名計數(skill play-stats-lite / play-stats-dwell)。
  // 零個資:無 cookie、無 IP 存檔、無帳號;離線時靜默跳過,不影響遊戲。
  // ⚠ 閘門用「黑名單」只擋本機開發 —— 絕不可寫成 hostname 白名單:
  //    平台白名單=每次搬家都會靜靜斷流,而搬家的人不會想到回來改這一行(0813 大廳/約拿、0815 但以理)。
  window.psPing = function (key, t) {
    try {
      if (['localhost', '127.0.0.1', ''].includes(location.hostname)) return;
      var u = 'https://hfpc-play-stats.summer09201017.workers.dev/api/ping?g=' + key + (t ? '&t=' + t : '');
      if (navigator.sendBeacon) navigator.sendBeacon(u); else fetch(u, { mode: 'no-cors' });
    } catch (_) {}
  };
  // ① 開啟:10 分鐘內同一台裝置只算一次
  try {
    var psK = 'ps-last-dragtetris';
    var psLast = parseInt(localStorage.getItem(psK) || '0', 10);
    if (Date.now() - psLast > 600000) { localStorage.setItem(psK, String(Date.now())); window.psPing('dragtetris'); }
  } catch (_) { window.psPing('dragtetris'); }
  // ② 真實停留:開頁 → 第一次離開回報一發 -dwell 帶秒數。
  //    ★ 只送這一發:手機鎖屏時常只送得出佇列第一個 beacon,同一刻連發兩個會有一發被丟掉。
  (function () {
    var _dwT0 = Date.now(), _dwSent = false;
    function _dwLeave() {
      if (_dwSent) return; _dwSent = true;
      var sec = Math.round((Date.now() - _dwT0) / 1000);
      if (sec < 3 || sec > 1800) return;   // 誤觸不算、掛整天的背景分頁也不算
      window.psPing('dragtetris-dwell', sec);
    }
    addEventListener('pagehide', _dwLeave);
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'hidden') _dwLeave();
    });
  })();
</script>

<!-- 🏷 版號兩件套（game-must-haves 第七件）：徽章 + 點得開的改版簡歷。
     ★ 版號和簡歷都在 APP_VERSIONS 這一处，徽章文字由程式帶出來。
       舊版把版號寫死在徽章的 innerText，改版忘了改它就會默默漂移（畫面說 v1、程式已經是 v2）。
     ★ 本站沒有手寫 sw.js（vite-plugin-pwa 自動產）⇒ 改版時只要在 APP_VERSIONS 最前面插一筆。 -->
<!-- ★ 徽章是「標籤」不是「按鈕」：pointer-events:none 不可或缺。
     0915 實測：改成可點之後它蓋住了手機下方 ⟳ 與 ▼ 兩顆鈕的下緣，
     拇指點下半部會跳出簡歷而不是操作遊戲。
     （elementFromPoint 量出來的；目視與截圖都看不出來。）
     ⇒ 簡歷改從「設定」面板開，那裡有空間、不搶操作。 -->
<div id="appVerBadge" aria-hidden="true"
     style="position:fixed;right:6px;bottom:4px;font-size:11px;line-height:1;opacity:.55;z-index:2147483000;pointer-events:none;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.9);font-family:system-ui,sans-serif"></div>
<style>
  /* ★ hidden 屬性的 display:none 來自瀏覽器預設樣式表，inline style 會贏過它。
     不寫這一行的話，這層全螢幕遮罩從一開頁就蓋在上面、攒下所有點擊。
     （0915 真瀏覽器驗收抓到；36 項單元測試全綠也看不到這種錯。） */
  #appVerSheet[hidden] { display: none !important; }
</style>
<div id="appVerSheet" hidden
     style="position:fixed;inset:0;z-index:2147483001;background:rgba(4,8,20,.78);display:flex;align-items:center;justify-content:center;padding:16px;font-family:system-ui,'Noto Sans TC',sans-serif">
  <div style="max-width:420px;width:100%;max-height:70vh;overflow:auto;background:#1a2247;border:1px solid #2a356b;border-radius:12px;padding:14px 16px;color:#e6eaff">
    <h3 style="margin:0 0 8px;font-size:15px">改版簡歷</h3>
    <ol id="appVerList" style="margin:0;padding-left:18px;font-size:12.5px;line-height:1.75"></ol>
    <button type="button" id="appVerClose"
            style="margin-top:12px;width:100%;min-height:40px;font:inherit;color:#e6eaff;background:#2a356b;border:1px solid #3a4a8b;border-radius:8px;cursor:pointer">關閉</button>
  </div>
</div>
<script>
;(function () {
  // 最新的放最前面。改版只要在這裡插一筆，徽章會自己跟上。
  var APP_VERSIONS = [
    { v: 'v4', d: '2026-09-16', t: '每日殘局（每天三題，出題時就用遊戲本身的規則證明過解得開）、悔一步（一局 3 次）、聖經主題皮膚（石頭與泥磚＋和合本經文）、設定面板加上永遠看得到的關閉鈕' },
    { v: 'v3', d: '2026-09-15', t: '拖曳可轉向（點一下托盤轉 90°，桌機拖曳中也能用 ↑ / Z / X）、每日挑戰與題號連結（?daily / ?seed=）' },
    { v: 'v2', d: '2026-09-15', t: '三種拖曳規則（經典重力 / 塞縫 / 自由建造）、最高分與個人紀錄、返回大廳與全螢幕鈕、完賽統計打點、引擎單元測試 36 項' },
    { v: 'v1', d: '2026-08-31', t: '版號徽章、使用統計匯入、棋盤欄數可選 7 / 8 / 12' }
  ];
  var badge = document.getElementById('appVerBadge');
  var sheet = document.getElementById('appVerSheet');
  var list  = document.getElementById('appVerList');
  var close = document.getElementById('appVerClose');
  if (!badge || !sheet || !list || !close) return;

  var latest = APP_VERSIONS[0];
  badge.textContent = '🏷️ 版本 ' + latest.v + '（' + latest.d + '）';
  list.innerHTML = APP_VERSIONS.map(function (r) {
    var esc = function (x) { return String(x).replace(/[&<>]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]; }); };
    return '<li><b>' + esc(r.v) + '</b>（' + esc(r.d) + '）：' + esc(r.t) + '</li>';
  }).join('');

  function open()  { sheet.hidden = false; }
  function shut()  { sheet.hidden = true; }
  // 給設定面板（React）叫的入口。
  window.__openVersionSheet = open;
  window.__appVersion = latest.v + '（' + latest.d + '）';
  close.addEventListener('click', shut);
  sheet.addEventListener('click', function (e) { if (e.target === sheet) shut(); });
  addEventListener('keydown', function (e) { if (e.key === 'Escape' && !sheet.hidden) shut(); });

  // 遞減淡出，10 秒後變得很淡（不拿掉，還看得到版號）。
  badge.style.transition = 'opacity .8s';
  setTimeout(function () { badge.style.opacity = '.2'; }, 10000);
})();
</script>
</body>
</html>
