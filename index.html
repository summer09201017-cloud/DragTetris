  <script>
  // play-stats 三層匿名計數(skill play-stats-lite / play-stats-dwell)。
  // 零個資:無 cookie、無 IP 存檔、無帳號;離線時靜默跳過,不影響遊戲。
  // ⚠ 閘門用「黑名單」只擋本機開發 —— 絕不可寫成 hostname 白名單:
  //    平台白名單=每次搬家都會靜靜斷流,而搬家的人不會想到回來改這一行(0813 大廳/約拿、0815 但以理)。
  window.psPing = function (key, t) {
    try {
      if (['localhost', '127.0.0.1', ''].includes(location.hostname)) return;
      var u = 'https://hfpc-play-stats.summer09201017.workers.dev/api/ping?g=' + key + (t ? '&t=' + t : '');
      if (navigator.sendBeacon) navigator.sendBeacon(u); else fetch(u, { mode: 'no-cors' });
    } catch (_) {}
  };
  // ① 開啟:10 分鐘內同一台裝置只算一次
  try {
    var psK = 'ps-last-dragtetris';
    var psLast = parseInt(localStorage.getItem(psK) || '0', 10);
    if (Date.now() - psLast > 600000) { localStorage.setItem(psK, String(Date.now())); window.psPing('dragtetris'); }
  } catch (_) { window.psPing('dragtetris'); }
  // ② 真實停留:開頁 → 第一次離開回報一發 -dwell 帶秒數。
  //    ★ 只送這一發:手機鎖屏時常只送得出佇列第一個 beacon,同一刻連發兩個會有一發被丟掉。
  (function () {
    var _dwT0 = Date.now(), _dwSent = false;
    function _dwLeave() {
      if (_dwSent) return; _dwSent = true;
      var sec = Math.round((Date.now() - _dwT0) / 1000);
      if (sec < 3 || sec > 1800) return;   // 誤觸不算、掛整天的背景分頁也不算
      window.psPing('dragtetris-dwell', sec);
    }
    addEventListener('pagehide', _dwLeave);
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'hidden') _dwLeave();
    });
  })();
</script>

<script>
;(function () {
  // 最新的放最前面。改版只要在這裡插一筆，徽章會自己跟上。
  var APP_VERSIONS = [
    { v: 'v4.2', d: '2026-09-16', t: '手機全螢幕真的會變大了：按 ⛶ 之後 HOLD／分數／NEXT 收成上方一條窄橫帶，棋盤從佔螢幕 44.6% 變成 70.3%（面積大 58%）；工具列可用 ▼ 收起、✕ 隨時離開全螢幕' },
    { v: 'v4.1', d: '2026-09-16', t: '手機健檢修正:橫向時標題列與 HUD 浮到兩側空白，棋盤高度 178→261px（寬度 +47%）；五顆備援鈕與大廳/全螢幕鈕 40→44px；版號徽章不再壓住按鈕' },
    { v: 'v4', d: '2026-09-16', t: '每日殘局（每天三題，出題時就用遊戲本身的規則證明過解得開）、悔一步（一局 3 次）、聖經主題皮膚（石頭與泥磚＋和合本經文）、設定面板加上永遠看得到的關閉鈕' },
    { v: 'v3', d: '2026-09-15', t: '拖曳可轉向（點一下托盤轉 90°，桌機拖曳中也能用 ↑ / Z / X）、每日挑戰與題號連結（?daily / ?seed=）' },
    { v: 'v2', d: '2026-09-15', t: '三種拖曳規則（經典重力 / 塞縫 / 自由建造）、最高分與個人紀錄、返回大廳與全螢幕鈕、完賽統計打點、引擎單元測試 36 項' },
    { v: 'v1', d: '2026-08-31', t: '版號徽章、使用統計匯入、棋盤欄數可選 7 / 8 / 12' }
  ];
  var badge = document.getElementById('appVerBadge');
  var sheet = document.getElementById('appVerSheet');
  var list  = document.getElementById('appVerList');
  var close = document.getElementById('appVerClose');
  if (!badge || !sheet || !list || !close) return;

  var latest = APP_VERSIONS[0];
  badge.textContent = '🏷️ 版本 ' + latest.v + '（' + latest.d + '）';
  list.innerHTML = APP_VERSIONS.map(function (r) {
    var esc = function (x) { return String(x).replace(/[&<>]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]; }); };
    return '<li><b>' + esc(r.v) + '</b>（' + esc(r.d) + '）：' + esc(r.t) + '</li>';
  }).join('');

  function open()  { sheet.hidden = false; }
  function shut()  { sheet.hidden = true; }
  // 給設定面板（React）叫的入口。
  window.__openVersionSheet = open;
  window.__appVersion = latest.v + '（' + latest.d + '）';
  close.addEventListener('click', shut);
  sheet.addEventListener('click', function (e) { if (e.target === sheet) shut(); });
  addEventListener('keydown', function (e) { if (e.key === 'Escape' && !sheet.hidden) shut(); });

  // 遞減淡出，10 秒後變得很淡（不拿掉，還看得到版號）。
  badge.style.transition = 'opacity .8s';
  setTimeout(function () { badge.style.opacity = '.2'; }, 10000);
})();
</script>

/* ★★ 0916 隊友(0916-直式打磚塊)提醒後補驗抓到的迴歸:
   本站 v4.1 已經有一段 `@media (orientation: landscape) and (max-height:500px)` 在改
   同一個 .layout 的 grid(標題列與 HUD 浮到兩側)。我的沉浸規則若不分方向,
   兩套會打架 —— 橫向展開態實測把棋盤壓成 63×157 = 螢幕的 3%,比不按 ⛶ 的 8.3% 還慘。
   ⇒ 下面整段**只在直向生效**;橫向交還給 v4.1 那套,沉浸在橫向只做「藏殼 + 可收起」。
   (橫向本身只有 8.3% 是 v4.1 就有的天花板:8×20 的盤在 844×390 裡最寬也只能到 156px,
    那是盤面比例問題,不在這一輪。) */
@media (orientation: portrait) {
/* 三欄 → 單欄:棋盤吃滿寬度 */

  body.mfs-imm .layout {
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr) auto auto;
    padding: 4px;
    gap: 4px;
  }
  body.mfs-imm .stage { grid-column: 1; grid-row: 2; }
  body.mfs-imm .side-controls { grid-column: 1; }
  
  /* 第一列同一格,三個東西分左中右 —— 不重疊、不浮在棋盤上 */
  body.mfs-imm .panel-left,
  body.mfs-imm .panel-right,
  body.mfs-imm .hud-stack {
    grid-column: 1;
    grid-row: 1;
    width: auto;
    height: auto;
  }
  body.mfs-imm .panel-left { justify-self: start; }
  body.mfs-imm .panel-right { justify-self: end; }
  body.mfs-imm .hud-stack { justify-self: center; width: min(150px, 38vw); }
  
  /* HOLD / NEXT 橫躺,才不會把第一列撐高 */
  body.mfs-imm .panel-left,
  body.mfs-imm .panel-right {
    flex-direction: row;
    align-items: center;
    gap: 6px;
  }
  /* ⚠ .mini 原本是 display:block —— 只寫 flex-direction:row 是**完全空轉**的
     (第二版就是漏了這行,第一列被 NEXT 撐到 120px,棋盤反而比沒按 ⛶ 還小)。 */
  body.mfs-imm .panel-left .mini,
  body.mfs-imm .panel-right .mini {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 4px;
    height: auto;
    padding: 2px 5px;
  }
  body.mfs-imm .mini-title {
    font-size: 9px;
    white-space: nowrap;
  }
  /* canvas 有自己的內在尺寸,用 max-height 讓它等比縮;width:auto 才不會被拉扁 */
  body.mfs-imm .panel-left canvas,
  body.mfs-imm .panel-right canvas {
    max-height: 40px;

<script>
/* mfs-collapsible-zoom v1 */
(function () {
  try {
    /* 嵌在別人站裡當關卡時不要搶宿主的版面 */
    if (window.self !== window.top) { var b0 = document.getElementById('mfsBar'); if (b0) b0.remove(); return; }

    /* backup-chain:ok —— 'mfs.fold' 是**裝置層偏好**(這支手機的工具列收著還是開著),
       不是使用者資料:掉了下次進來就是預設的「開著」,零損失、會自動重建。
       刻意**不**接進匯出/匯入 —— 把它寫進備份,反而會把平板的收合狀態帶到手機上。 */
    var KEY = 'mfs.fold';
    var bar = document.getElementById('mfsBar');
    var foldBtn = document.getElementById('mfsFold');
    var exitBtn = document.getElementById('mfsExit');
    var adoptSel = ".app-header .header-btn[aria-pressed]";
    var mountSel = "";
    /* 掛進站上既有的按鈕列。找不到就留在原地(body 尾)當浮動列,不要整支炸掉 */
    if (mountSel && bar) {
      try { var host = document.querySelector(mountSel); if (host) host.appendChild(bar); } catch (e) {}
    }

    /* ⚠ Safari 私密模式讀 localStorage 會**丟例外**,不是回 null。
       不包 try/catch 的話這一行就把後面所有 addEventListener 帶走,整排鈕靜靜失效。 */
    var FOLD_DEFAULT = true;
    var folded = FOLD_DEFAULT;
    try {
      var saved = window.localStorage.getItem(KEY);
      if (saved === '1' || saved === '0') folded = saved === '1'; /* 使用者自己選過就聽他的 */
    } catch (e) {}

    var isFs = function () { return !!(document.fullscreenElement || document.webkitFullscreenElement); };
    var imm = false;

    function refit() {
      /* canvas / Three.js 多半聽 resize 重算尺寸;版面剛變要等一幀再發,不然量到舊尺寸 */
      requestAnimationFrame(function () {
        try { window.dispatchEvent(new Event('resize')); } catch (e) {}
      });
    }

    function paint() {
      try {
        document.body.classList.toggle('mfs-imm', imm);
        document.body.classList.toggle('immersive', imm); /* 沿用 v1 的類名,既有站的 CSS 才吃得到 */
        document.body.classList.toggle('mfs-fold', imm && folded);
        if (foldBtn) {
          foldBtn.textContent = folded ? '▲' : '▼ 收起';
          foldBtn.title = folded ? '展開工具列' : '收起工具列(主畫面看得更清楚)';
          foldBtn.setAttribute('aria-label', foldBtn.title);
          foldBtn.setAttribute('aria-expanded', String(!folded));
        }
        /* 收起時只收「字」,不收「出口」—— 圖示鈕留著,不然全螢幕就沒得退 */
        if (exitBtn) {
          exitBtn.textContent = folded ? '✕' : '✕ 離開全螢幕';
          exitBtn.setAttribute('aria-label', '離開全螢幕');
        }
      } catch (e) {}
      refit();
    }

    if (foldBtn) foldBtn.addEventListener('click', function () {
      folded = !folded;
      try { window.localStorage.setItem(KEY, folded ? '1' : '0'); } catch (e) {}
      paint();
    });

    if (exitBtn) exitBtn.addEventListener('click', function () {
      try {
        var out = document.exitFullscreen || document.webkitExitFullscreen;
        if (isFs() && out) { var q = out.call(document); if (q && q.catch) q.catch(function () {}); }
      } catch (e) {}
      /* iPhone Safari 沒有網頁全螢幕 ⇒ 上面那段不會發生任何事,
         沉浸樣式得自己收,不然使用者按了「離開」卻沒反應。 */
      imm = false;
      paint();
    });

    /* 真全螢幕的裝置(Android/桌機):狀態一律以 fullscreenchange 為準,
       這樣使用者按 Esc / 系統手勢退出時,沉浸樣式也會跟著收。 */
    var supports = !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen);
    if (supports) ['fullscreenchange', 'webkitfullscreenchange'].forEach(function (ev) {
      document.addEventListener(ev, function () { imm = isFs(); paint(); });
    });

    /* 認養站上原有的那顆 ⛶:
       ①iPhone 沒有 fullscreenchange,只能靠這條才進得了沉浸
       ②用事件委派而不是直接綁那顆鈕 —— React/Vue 重繪會換掉節點,直接綁會脫鉤 */
    if (adoptSel) document.addEventListener('click', function (ev) {
      try {
        var t = ev.target && ev.target.closest && ev.target.closest(adoptSel);
        if (!t) return;
        if (supports) return; /* 支援全螢幕的裝置交給 fullscreenchange,免得按一下切兩次 */
        imm = !imm;
        setTimeout(paint, 0);
      } catch (e) {}
    }, true);

    paint();
  } catch (e) { /* 補丁自己壞掉也不能弄壞遊戲 */ }
})();
</script>
<!-- mfs-collapsible-zoom v1 : end -->
</body>
</html>
